# ARCHIVED REPO — this workflow no longer runs automatically. See ../../ARCHIVED.md.
#
# It triggered on push-to-main and every pull_request, and the `verify:contract` step below was RED on
# `main`: it diffs this repo's `contracts/` against the world backend's `main`, and those contracts are
# three generations behind (world_directory.v1 vs v2, scene_current.v2 vs v4, beat_frame.v2 vs v5).
# Evidence: ../../../docs/90_archive/reports/QA-2026-08-11-frontend.md:99 and
# ../../../docs/90_archive/reports/QA-SPAN-2026-08-11.md §3.
#
# In an archived repo that staleness is BY DESIGN, so the gate was asking a question with a known
# wrong answer. It is disabled rather than fixed, because a permanently-red gate everyone ignores
# teaches people to ignore gates (workspace:ADR-W003).
#
# The job definition is kept intact: it is the record of what the predecessor's battery was.
name: CI (archived — manual only)
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run verify:types
      - run: npm run build
      - run: npm test
      # The contract gate, last so a failure here is unambiguous. It compares contracts/ against the
      # BACKEND'S main, falling back to raw.githubusercontent when no sibling checkout exists — which
      # is always the case on a runner. That makes this the one step whose result depends on another
      # repository at the moment it runs: a backend contract change can turn a green PR here red
      # without anyone touching this one. That is the intended behaviour — drift should be loud, and
      # twice now this gate has been the only thing that caught a schema moving under us.
      - run: npm run verify:contract
